name: Daily Gym Data Pipeline Google Sheets

on:
  push:
    branches:
      - dev               # Trigger on push to dev branch
  schedule:
    - cron: '0 2 * * *'   # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest  # Your Windows machine running the GitHub runner

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode service account JSON (bash)
        shell: bash
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_FILE }}" | base64 -d > service_account.json


      - name: Run Gym to google sheets.py
        shell: bash
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          google_sheets_id: ${{ secrets.GOOGLE_SHEETS_ID}}
        run: |
          python "Gym to google sheets.py" "Workout Form Responses"
