name: Daily Gym Data Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:     # Optional: allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account file from base64
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_FILE }}" | base64 --decode > service_account.json

      - name: Run Gym Git.py
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SCHEMA: ${{ secrets.SCHEMA }}
          DB_NAME: ${{ secrets.DB_NAME }}
          HOST: localhost
          PORT: 5432
        run: |
          python "Gym Git.py" "Workout Form Responses"



