name: Daily Gym Data Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:     # Optional: allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Match your script's environment

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account file from base64
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_FILE }}" | base64 --decode > service_account.json

      - name: Start Postgres service
        uses: harmon758/postgresql-action@v1.1.0
        with:
          postgresql version: '13'
          postgresql db: ${{ secrets.DB_NAME }}
          postgresql username: ${{ secrets.USERNAME }}
          postgresql password: ${{ secrets.PASSWORD }}
          postgresql port: 5432

      - name: Run Gym Git.py
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SCHEMA: ${{ secrets.SCHEMA }}
          DB_NAME: ${{ secrets.DB_NAME }}

        run: |
          python "Gym Git.py" "Workout Form Responses"


