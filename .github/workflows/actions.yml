name: Daily Gym Data Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2:00 AM UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: self-hosted  # This is your local Windows machine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode service account JSON (PowerShell on Windows)
        shell: pwsh
        run: |
          $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.SERVICE_ACCOUNT_FILE }}"))
          Set-Content -Path "service_account.json" -Value $decoded

      - name: Run Gym Git.py
        shell: pwsh
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SCHEMA: ${{ secrets.SCHEMA }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python "Gym Git.py" "Workout Form Responses"


