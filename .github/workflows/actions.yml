name: Daily Gym Data Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:     # Allows manual trigger

jobs:
  run-pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account file from base64
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_FILE }}" | base64 --decode > service_account.json

      - name: Run Gym Git.py
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          USERNAME: ${{ secrets.DB_USERNAME }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
          SCHEMA: ${{ secrets.SCHEMA }}
          DB_NAME: ${{ secrets.DB_NAME }}
          HOST: ${{ secrets.DB_HOST }}
          PORT: ${{ secrets.DB_PORT }}
        run: |
          python "Gym Git.py" "Workout Form Responses"




