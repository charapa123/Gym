version: 2

sources:
  - name: raw
    description: data from postgres data base
    database: gym 
    schema: raw  # schema where raw tables live
    tables:
      - name: raw_form_answers
        description: this contains the raw json response of answers from google forms and an insert timestsamp
        columns:
          - name: answers
            tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 12
              period: day
            error_after: 
              count: 100
              period: day
          loaded_at_field: insert_timestamp
      - name: raw_form_questions
        description: this contains the raw json response of questions from google forms and an insert timestsamp



